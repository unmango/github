name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# A new push to a pull request supersedes its older runs. Pushes to main get a
# group of their own so no deploy is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  pulumi:
    runs-on: thecluster
    # Pulumi Cloud fails an update with 409 while another holds the stack's lease.
    # Every run against prod waits its turn in order, so deploys never collide
    # and a preview sees state after the deploys queued ahead of it.
    concurrency:
      group: pulumi-prod
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: unmango/actions/setup-nix@56abf92ca6c8e241831118a76b7b2ce1d3b8d414 # v1.1.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Dprint check
        if: github.event_name == 'pull_request'
        run: nix develop -c dprint check

      - name: Lint
        if: github.event_name == 'pull_request'
        run: nix develop -c make lint

      - name: Pulumi login
        uses: pulumi/auth-actions@v2
        with:
          organization: UnstoppableMango
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:UnstoppableMango

      - name: Set Pulumi flags
        run: |
          flags=""
          if [ "${{ github.actor }}" = "renovate[bot]" ]; then
            flags="$flags --expect-no-changes"
          fi
          echo "PULUMI_FLAGS=$flags" >> "$GITHUB_ENV"

      - name: Preview
        if: github.event_name == 'pull_request'
        run: nix develop -c make preview

      - name: Deploy
        if: github.event_name == 'push'
        env:
          PULUMI_FLAGS: --yes ${{ env.PULUMI_FLAGS }}
        run: nix develop -c make up
